version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: royal-grace-backend:local
    container_name: royal-grace-backend
    expose:
      - "8080"  # Changed from ports to expose - only accessible internally
    environment:
      SPRING_DATASOURCE_URL: jdbc:h2:file:/data/royalgrace
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ""
      LOGGING_LEVEL_ORG_HIBERNATE_SQL: warn
      ADMIN_DEFAULT_USERNAME: admin
      ADMIN_DEFAULT_PASSWORD: change-me
      ADMIN_DEFAULT_EMAIL: ""
    volumes:
      - h2data:/data
    networks:
      - app-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: royal-grace-frontend:local
    container_name: royal-grace-frontend
    depends_on:
      - backend
    expose:
      - "3000"  # Changed from ports to expose
    environment:
      API_BASE_URL: http://backend:8080
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: change-me
      ADMIN_JWT_SECRET: super-secret-change-me
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: royal-grace-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app-network
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: royal-grace-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  h2data:

networks:
  app-network:
    driver: bridge